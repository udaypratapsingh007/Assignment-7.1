<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Inspection</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Box Model Inspection</h1>

    <!-- Box 1: content-box -->
    <div class="box box-one">
      <h2>Box One</h2>
      <p>Padding 10px, border 2px, margin 10px. Uses content-box.</p>
    </div>

    <!-- Box 2: border-box -->
    <div class="box box-two">
      <h2>Box Two</h2>
      <p>Padding 30px, border 8px, margin 30px. Uses border-box.</p>
    </div>

    <!-- Box 3: content-box with large values -->
    <div class="box box-three">
      <h2>Box Three</h2>
      <p>Padding 20px, border 5px, margin 20px. Uses content-box with the same width.</p>
    </div>
  </body>
</html>
